[package]
name = "claude-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bridge-server"
path = "src/bin/server.rs"

[[bin]]
name = "bridge-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "claude-bridge"
path = "src/bin/bridge.rs"

# Legacy alias. Some setups still reference `/usr/local/bin/bridge`;
# iproute2 also ships `bridge` so users hitting PATH collisions
# should call `claude-bridge` instead. Keeping both targets means
# old install scripts don't break while the new name takes over.
[[bin]]
name = "bridge"
path = "src/bin/bridge.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"
# Bundled sqlite — no system libsqlite3 needed at runtime, single
# static binary. Used by the optional persistence layer (enabled
# when BRIDGE_DB_PATH is set in the server's env).
rusqlite = { version = "0.31", features = ["bundled"] }
parking_lot = "0.12"
thiserror = "1"
# Audit-log content hashing. We only need a fixed-output one-way
# digest; sha2 is the small/standard choice and pulls in no extra
# transitive load. Truncated to 16 hex chars at the call site —
# 64-bit collision-resistance is enough for forensic joins at
# bridge scale (~thousands of events/year).
sha2 = "0.10"
# trait fn async in a `dyn Scanner` requires async_trait until the
# stable RPITIT path lands for dyn-compatible traits.
async-trait = "0.1"
